name: Restore index.html
on:
  push:
    branches: [ main ]
jobs:
  restore:
    if: "contains(github.event.head_commit.message, 'restore-index')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html from history
        run: |
          git checkout 83aaefecc2d7f0c69272b97ed8009734d721c14a -- index.html
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Restore index.html to v0.8.7 (working version)"
          git push
