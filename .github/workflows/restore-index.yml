name: Restore v0.8.9
on:
  push:
    branches: [ main ]
jobs:
  restore:
    if: "contains(github.event.head_commit.message, 'restore-v089')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html and sw.js from v0.8.9 (112f29a2)
        run: |
          git checkout 112f29a2fddbb55908536ffce2dbc956fcf67d22 -- index.html sw.js
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "restore-v089: 恢复 index.html 到 v0.8.9 原始版本"
          git push
