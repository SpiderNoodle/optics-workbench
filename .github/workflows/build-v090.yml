# 此工作流已禁用：v0.9.0 构建脚本已被验证会破坏页面功能，现已回滚至 v0.8.9。
# 如需重新尝试，需先重写 build 脚本并在本地验证 JS 无语法错误后再启用。
name: Build v0.9.0 Safe (DISABLED)
on:
  push:
    branches: [ never-used-branch ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run safe build script
        run: python build_v090_safe.py
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "v0.9.0 safe: Kindle降亮+Office主题+单位速查表格+简洁随机动画"
          git push
