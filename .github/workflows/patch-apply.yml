name: Apply v0.9.0 Patch
on:
  push:
    branches: [ main ]
jobs:
  apply:
    if: "contains(github.event.head_commit.message, 'apply-v090-patch')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply patch to index.html
        run: |
          git apply patch_index.patch && echo "PATCH APPLIED OK"
      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "v0.9.0: Kindle降亮+Office主题+单位速查表格化+随机动画 (via patch)"
          git push