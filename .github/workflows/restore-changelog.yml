name: Restore CHANGELOG
on:
  push:
    branches: [ main ]
jobs:
  restore:
    if: "contains(github.event.head_commit.message, 'restore-changelog')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore CHANGELOG from history
        run: |
          git checkout 83aaefecc2d7f0c69272b97ed8009734d721c14a -- CHANGELOG.md
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "Restore CHANGELOG.md from git history (v0.8.7 version)"
          git push
